<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DailyEnglish">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>DailyEnglish</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna; tarjeta de racha arriba, tareas debajo, barra de pestañas fija abajo */
:root{
  --bg:#e8eef8; --surface:#ffffff; --surface2:#f2f6fc; --ink:#141c2b; --muted:#56637a; --line:#d4ddea;
  --accent:#0a9584; --accent-ink:#ffffff; --accent-soft:#c6f1e8;
  --flame:#ef5a12; --flame-soft:#ffd9c2; --good:#22a04f; --good-soft:#cdf3da;
  --c-gram:#4b4fe6; --c-gram-soft:#d7d9ff; --c-speak:#e02d68; --c-speak-soft:#ffd3e1;
  --c-vocab:#c27a00; --c-vocab-soft:#ffe7a8; --c-listen:#1a72e8; --c-listen-soft:#cfe3ff;
  --c-shadow:#7d32ea; --c-shadow-soft:#e5d5ff; --hero:linear-gradient(135deg,#ffddc6 0%,#ffcfe0 50%,#ddd2ff 100%);
  --band:linear-gradient(135deg,#c4f0e7 0%,#d2e2ff 100%);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1320; --surface:#151f2e; --surface2:#1b2738; --ink:#eaf0f7; --muted:#9aa9bd; --line:#2b3b51;
  --accent:#2fd6c2; --accent-ink:#04211d; --accent-soft:#0f4440; --flame:#ff8a45; --flame-soft:#4a2410; --good:#4fd67f; --good-soft:#0f3d22;
  --c-gram:#8f93ff; --c-gram-soft:#2a2c66; --c-speak:#ff6f9c; --c-speak-soft:#521a30;
  --c-vocab:#ffc23d; --c-vocab-soft:#4a360a; --c-listen:#5aa9ff; --c-listen-soft:#143661;
  --c-shadow:#b98aff; --c-shadow-soft:#3a1f63; --hero:linear-gradient(135deg,#4a2410 0%,#4d1830 50%,#2e1f5c 100%);
  --band:linear-gradient(135deg,#0f4440 0%,#1a2f63 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1320; --surface:#151f2e; --surface2:#1b2738; --ink:#eaf0f7; --muted:#9aa9bd; --line:#2b3b51;
  --accent:#2fd6c2; --accent-ink:#04211d; --accent-soft:#0f4440; --flame:#ff8a45; --flame-soft:#4a2410; --good:#4fd67f; --good-soft:#0f3d22;
  --c-gram:#8f93ff; --c-gram-soft:#2a2c66; --c-speak:#ff6f9c; --c-speak-soft:#521a30;
  --c-vocab:#ffc23d; --c-vocab-soft:#4a360a; --c-listen:#5aa9ff; --c-listen-soft:#143661;
  --c-shadow:#b98aff; --c-shadow-soft:#3a1f63; --hero:linear-gradient(135deg,#4a2410 0%,#4d1830 50%,#2e1f5c 100%);
  --band:linear-gradient(135deg,#0f4440 0%,#1a2f63 100%); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:24px;line-height:1.1;background:linear-gradient(90deg,var(--accent),var(--c-gram));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;line-height:1.2}
h3{font-size:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);margin:0}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,.task:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabecera */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .sub{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;background:var(--flame-soft);color:var(--flame);font:700 15px var(--display);white-space:nowrap}
.pill.off{background:var(--surface2);color:var(--muted)}
.pill svg{width:18px;height:18px}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}

/* racha */
.card.hero{background:var(--hero);border-color:transparent}
.card.dayc{position:relative;overflow:hidden}
.dayband{margin:-16px -16px 0;padding:14px 16px;background:var(--band)}
.streak{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.flame{width:84px;height:84px;border-radius:22px;background:var(--surface);box-shadow:0 6px 18px -8px var(--flame);display:grid;place-items:center;position:relative}
.flame svg{width:46px;height:46px;color:var(--flame)}
.flame.off{background:var(--surface);box-shadow:none}
.flame.off svg{color:var(--muted);opacity:.6}
.streak .big{font:800 44px/1 var(--display);letter-spacing:-.03em}
.streak .lbl{font-weight:600}
.streak .msg{font-size:13.5px;margin-top:4px}
.msg.warn{color:var(--flame)}
.msg.ok{color:var(--good)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.days .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.days .c{width:30px;height:30px;border-radius:50%;border:2px solid color-mix(in srgb,var(--flame) 30%,var(--line));background:var(--surface);display:grid;place-items:center}
.days .c.on{background:var(--flame);border-color:var(--flame)}
.days .c.on svg{width:15px;height:15px;color:var(--surface)}
.days .c.today{border-color:var(--flame);border-style:dashed}
.days .c.future{opacity:.45}
.best{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.best b{color:var(--ink);font-variant-numeric:tabular-nums}

/* día */
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.arrows{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;cursor:pointer;display:grid;place-items:center;font-size:16px}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.txt{width:auto;padding:0 12px;font-weight:600;font-size:14px}
.ringrow{display:flex;align-items:center;gap:14px}
.ring{width:58px;height:58px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font:700 14px var(--display);fill:var(--ink)}
.topics{display:grid;gap:8px}
.topic{border-radius:12px;padding:8px 10px;background:var(--tc-soft)}
.topic .eyebrow{color:var(--tc);font-weight:700}
.topic{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:baseline;font-size:14px}
.topic b{font-weight:600}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
button.task{width:100%;text-align:left;font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface)}
.task:disabled{cursor:default}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--c,var(--accent));background:var(--c-soft,transparent);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;color:var(--surface);opacity:0}
.task.done{background:var(--c-soft,var(--accent-soft));border-color:transparent}
.task.done .box{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.task.done .box svg{opacity:1}
.task.done .t{text-decoration:line-through;text-decoration-color:var(--c,var(--accent))}
.task .t .lbl{color:var(--c,var(--ink))}
.task.main:not(.done){border-color:color-mix(in srgb,var(--flame) 55%,var(--line))}
.task .t{font-weight:600}
.task .dd{font-size:13.5px;color:var(--muted);display:block}
.task .m{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--flame-soft);color:var(--flame);margin-left:6px;vertical-align:1px}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.wd.today{border:2px solid var(--accent)}
.wd .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.wd .p{font:700 14px var(--display)}
.dot{width:80%;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.dot i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--c-listen))}
.rows{display:flex;flex-direction:column}
.rowi{display:grid;grid-template-columns:86px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rowi:last-child{border-bottom:0}
.rowi.cur{color:var(--accent);font-weight:600}

/* avance */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:12px}
.stat:nth-child(1){background:var(--flame-soft)}.stat:nth-child(1) .v{color:var(--flame)}
.stat:nth-child(2){background:var(--c-listen-soft)}.stat:nth-child(2) .v{color:var(--c-listen)}
.stat:nth-child(3){background:var(--c-gram-soft)}.stat:nth-child(3) .v{color:var(--c-gram)}
.stat:nth-child(4){background:var(--good-soft)}.stat:nth-child(4) .v{color:var(--good)}
.stat .v{font:800 28px/1.1 var(--display)}
.stat .l{font-size:12.5px;color:var(--muted)}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.phase{display:flex;flex-direction:column;gap:5px}
.phase .bar span{background:var(--pc,var(--accent))}
.phase .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat span{aspect-ratio:1;border-radius:6px;background:var(--line);max-width:100%}
.heat span.lv1{background:color-mix(in srgb,var(--flame) 35%,var(--line))}
.heat span.lv2{background:color-mix(in srgb,var(--flame) 65%,var(--line))}
.heat span.lv3{background:var(--flame)}
.heat-head{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font:500 11px var(--mono);color:var(--muted);text-align:center}
.legend{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr.cur td{background:var(--accent-soft)}
.scroll{overflow-x:auto}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--c-gram-soft);color:var(--c-gram)}
form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
form.inline label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input[type=number],input[type=date],textarea{font:500 15px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:80px;font:500 12.5px var(--mono)}
.btn{font:600 14px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.sync{font-size:12.5px;color:var(--muted);text-align:center}
.sync.warn{color:var(--flame)}

/* errores */
.catbars{display:flex;flex-direction:column;gap:8px}
.catbar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:13.5px}
.catbar .bar span{background:linear-gradient(90deg,var(--c-speak),var(--flame))}
.err{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.err.ok{opacity:.6}
.err .pair{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;align-items:baseline}
.err .bad{color:var(--flame);text-decoration:line-through;text-decoration-thickness:1.5px}
.err .good{font-weight:600}
.err .mk{font:700 13px var(--mono)}
.err .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.err .acts{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{font:600 12.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.sbtn.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.count{font:800 18px var(--display);color:var(--c-speak);min-width:28px}
.top5{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.top5 li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline;font-size:14px}
.form-err{display:grid;gap:8px}
.form-err input[type=text],.form-err select{font:500 15px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);width:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:600}
/* tarjetas plegables */
.foldhead{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.foldhead:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.foldhead .badge{font:700 13px var(--mono);padding:3px 10px;border-radius:999px;background:var(--fc-soft);color:var(--fc)}
.chev{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fc-soft);color:var(--fc);transition:transform .2s}
.chev svg{width:16px;height:16px}
.fold[data-state="true"] .chev{transform:rotate(180deg)}
.fold .hint{font-size:13px;color:var(--muted)}
/* práctica */
.q{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface2)}
.q .s{font-weight:600}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:600 14px var(--body);padding:8px 14px;border-radius:999px;border:2px solid var(--c-gram);background:var(--surface);color:var(--c-gram);cursor:pointer}
.opt.right{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:var(--c-speak);border-color:var(--c-speak);color:var(--surface)}
.opt:disabled{cursor:default}
.why{font-size:13.5px;color:var(--muted)}
.score{font:800 22px var(--display);color:var(--c-gram)}
a.link{color:var(--c-gram);font-weight:600}
/* vocabulario */
.vlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.vitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--c-vocab-soft)}
.vitem .w{font:700 16px var(--display);color:var(--ink)}
.vitem .es{font-size:13.5px;color:var(--c-vocab);font-weight:600}
.vitem .ex{grid-column:1/-1;font-size:13.5px;color:var(--muted);font-style:italic}
.vitem.known{background:var(--surface2)}
.vitem.known .w{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--c-vocab)}
.know{font:600 12.5px var(--body);border:2px solid var(--c-vocab);background:var(--surface);color:var(--c-vocab);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.know.on{background:var(--c-vocab);color:var(--surface)}
.vbar .bar span{background:var(--c-vocab)}
/* barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabbar button{min-width:0;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;cursor:pointer;font:600 11.5px var(--body)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--tb,var(--accent));background:var(--tb-soft,var(--accent-soft))}

/* aviso */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;transition:.25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-today" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g></symbol>

 {id:"h12",s:26,t:"Examen oficial"}];
const PRINCIPAL={
 1:[["Gramática de la semana","Haz la práctica de abajo, luego más ejercicios en Test-English, y escribe 5 frases propias sobre tu trabajo.",30],
  ["Speaking grabado","Habla 2 minutos sobre el tema de la semana. Grábate, escucha y anota 3 errores en la pestaña Errores.",25],

 3:[["Reading & Use of English cronometrado","Haz la sección completa con el tiempo real del examen.",75],
  ["Simulacro de Speaking","Responde las 4 partes del Speaking del examen. Grábate y evalúate.",20],
  ["Writing cronometrado","Escribe las 2 tareas de Writing con el tiempo real.",80],
  ["Entrevista en inglés","Practica la pregunta de entrevista de la semana sin guion, 3 veces.",20],
  ["Listening completo","Haz la sección completa de Listening con tiempo.",40],
  ["Examen de práctica completo","Las 4 partes seguidas, como el día del examen. Anota el puntaje.",210],
  ["Revisión del simulacro","Corrige el examen de ayer y suma los errores a tu lista.",30]]};
const DIARIAS=[
 ["listening","Listening","Podcast o charla técnica: 6 Minute English, All Ears English o YouTube de 5G.",15],

// ---------- fechas ----------
const mk=(y,m,d)=>new Date(y,m,d,12);
const START_D=mk(...START);
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayIndex=d=>Math.round((mk(d.getFullYear(),d.getMonth(),d.getDate())-START_D)/864e5);
const fecha=d=>d.getDate()+" "+MESES[d.getMonth()];
const TOTAL_DAYS=TOTAL_WEEKS*7;
const clampIdx=i=>Math.max(0,Math.min(TOTAL_DAYS-1,i));
const faseDe=s=>FASES.find(f=>s>=f.desde&&s<=f.hasta);
function today(){const n=new Date();return mk(n.getFullYear(),n.getMonth(),n.getDate())}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function tareas(idx){
  const s=Math.floor(idx/7)+1, wd=idx%7, f=faseDe(s), list=[];
  const COL={listening:"listen",anki:"vocab",shadowing:"shadow",hablar:"speak"};
  if(wd<5) DIARIAS.forEach(t=>list.push({id:t[0],t:t[1],d:t[2],m:t[3],col:COL[t[0]]}));
  else list.push({id:"anki",t:"Anki",d:"Repaso corto del día.",m:10,col:"vocab"});
  const p=PRINCIPAL[f.n][wd];
  list.push({id:"main",t:p[0],d:p[1],m:p[2],main:true,col:"flame"});
  return list;
}

// ---------- estado ----------
let state={checks:{},hitos:{},scores:[],errores:[],vocab:{}};
let ref=null, mode="local", writing=Promise.resolve(), canWrite=true;
const LS="ruta-ingles-v1";
const IN_VIEWER=!!(window.claude&&window.claude.use);
function loadLocal(){try{const s=localStorage.getItem(LS);if(s){const d=JSON.parse(s);state={checks:d.checks||{},hitos:d.hitos||{},scores:d.scores||[],errores:d.errores||[],vocab:d.vocab||{}}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function setStatus(t,warn){const el=document.getElementById("status");el.textContent=t;el.classList.toggle("warn",!!warn)}
let pending=0, lastEdit=0;
function persist(){
  lastEdit=Date.now();
  saveLocal();
  if(mode!=="db"||!ref) return;
  const body=JSON.parse(JSON.stringify(state));
  pending++;
  writing=writing.then(()=>ref.set(body)).finally(()=>{pending--;lastEdit=Date.now()}).then(()=>setStatus("Sincronizado con tu cuenta.")).catch(e=>{
    if(e&&e.code==="invalid_argument"){canWrite=false;setStatus("Solo lectura en esta página.",true);renderAll()}
    else setStatus("No se pudo sincronizar. Quedó guardado en este dispositivo.",true)});
}

// ---------- cálculos ----------
function prog(idx){
  if(idx<0||idx>=TOTAL_DAYS) return {done:0,total:0};
  const k=key(addDays(START_D,idx)), ts=tareas(idx);
  return {done:ts.filter(t=>state.checks[k+":"+t.id]).length,total:ts.length};
}
const activo=i=>prog(i).done>0;
function racha(){
  const t=dayIndex(today()); if(t<0) return {n:0,hoy:false};
  let i=Math.min(t,TOTAL_DAYS-1); const hoy=t<TOTAL_DAYS&&activo(t);
  if(!hoy) i--;
  let n=0; while(i>=0&&activo(i)){n++;i--}
  return {n,hoy};
}
function mejorRacha(){let b=0,c=0;for(let i=0;i<TOTAL_DAYS;i++){if(activo(i)){c++;b=Math.max(b,c)}else c=0}return b}
const nivel=p=>p<=30?"A1":p<=40?"A2":p<=50?"B1":p<=60?"B2":p<=70?"C1":"C2";

// ---------- vistas ----------
let viewIdx=clampIdx(dayIndex(today()));
let lastStreak=null;
const check='<svg><use href="#i-check"/></svg>';

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2600)}

function renderTop(){
  const r=racha(), t=dayIndex(today()), s=Math.floor(clampIdx(t)/7)+1;
  document.getElementById("pilln").textContent=r.n;
  const pill=document.getElementById("pill");
  pill.classList.toggle("off",!r.hoy);
  pill.setAttribute("aria-label",`Racha de ${r.n} días`);
  document.getElementById("sub").textContent=t<0?"Empieza el lunes 2 de noviembre":t>=TOTAL_DAYS?"Plan terminado":`Semana ${s} de ${TOTAL_WEEKS} · Fase ${faseDe(s).n}`;
}

function streakCard(){
  const r=racha(), best=mejorRacha(), t=dayIndex(today());
  let msg, cls;
  if(r.hoy){msg="Hoy ya sumaste a tu racha.";cls="ok"}
  else if(r.n>0){msg=`Marca una tarea hoy para no perder tus ${r.n} día${r.n===1?"":"s"}.`;cls="warn"}
  else {msg="Marca tu primera tarea de hoy para empezar la racha.";cls="warn"}
  // últimos 7 días terminando hoy
  let cells="";
  for(let i=6;i>=0;i--){const idx=t-i, d=addDays(today(),-i), on=activo(idx), wd=(d.getDay()+6)%7;
    cells+=`<div class="d"><span class="c${on?" on":""}${i===0&&!on?" today":""}">${on?'<svg><use href="#i-check"/></svg>':""}</span>${DC[wd]}</div>`}
  return `<section class="card hero" aria-label="Racha">
    <div class="streak">
      <div class="flame${r.hoy?"":" off"}" id="flame"><svg><use href="#i-flame"/></svg></div>
      <div><div class="big num">${r.n}</div><div class="lbl">día${r.n===1?"":"s"} de racha</div><div class="msg ${cls}">${msg}</div></div>
    </div>
    <div class="days">${cells}</div>
    <div class="best"><span>Mejor racha: <b>${best}</b></span><span>La racha cuenta si marcas al menos una tarea en el día.</span></div>
  </section>`;
}

const QUIZ={1:{expl:"Present simple: rutinas, hechos y cosas permanentes (I work, it has). Present continuous: lo que pasa ahora o en esta etapa temporal (I am working this week). Verbos de estado como know, understand, need y have (tener) casi nunca van en continuo.",
 qs:[["I usually ___ drive tests on Tuesdays.",["do","am doing"],0,"Rutina: present simple."],
  ["This week I ___ on a new 5G site.",["work","am working"],1,"Algo temporal, solo esta semana: present continuous."],

const practicaURL=s=>s<=10?"https://test-english.com/grammar-points/b1/contents-b1/":"https://test-english.com/grammar-points/b2/contents-b2/";
const quizSel={};
let openQ=false, openV=false;
const chev='<span class="chev" aria-hidden="true"><svg><use href="#i-chev"/></svg></span>';
function foldHead(key,open,eyebrow,title,badge,col){return `<button type="button" class="foldhead" data-fold="${key}" aria-expanded="${open}"><span><span class="eyebrow" style="color:var(--${col})">${eyebrow}</span><h3>${esc(title)}</h3>${open?"":`<span class="hint">Toca para ${key==="q"?"practicar":"ver la lista"}</span>`}</span>${badge?`<span class="badge num">${badge}</span>`:"<span></span>"}${chev}</button>`}
function practicaCard(s){
  const w=SEMANAS[s-1], q=QUIZ[s];
  const link=s===1?"https://test-english.com/grammar-points/b1/present-simple-present-continuous/":practicaURL(s), lvl=s<=10?"B1":"B2";
  if(!q) return `<section class="card fold" id="quiz" data-state="${openQ}" style="--fc:var(--c-gram);--fc-soft:var(--c-gram-soft)">${foldHead("q",openQ,"Práctica de gramática",w[0],"","c-gram")}${!openQ?"":`<p class="note">Tema: <b>${esc(w[0])}</b>. Abre el índice de lecciones ${lvl} de Test-English y entra al tema de la semana: tiene explicación y ejercicios con corrección.</p><p style="margin:0"><a class="link" href="${link}" target="_blank" rel="noopener">Abrir lecciones ${lvl} en Test-English ↗</a></p>`}</section>`;
  const sel=quizSel[s]||{}; const answered=Object.keys(sel).length, ok=q.qs.filter((x,i)=>sel[i]===x[2]).length;
  return `<section class="card fold" id="quiz" data-state="${openQ}" style="--fc:var(--c-gram);--fc-soft:var(--c-gram-soft)">${foldHead("q",openQ,"Práctica de gramática",w[0],answered?ok+"/"+q.qs.length:"","c-gram")}
    ${!openQ?"":`<p class="note">${esc(q.expl)}</p>
    ${q.qs.map((x,i)=>{const a=sel[i];return `<div class="q"><span class="s">${i+1}. ${esc(x[0])}</span>
      <div class="opts">${x[1].map((o,j)=>`<button class="opt${a!==undefined?(j===x[2]?" right":(j===a?" wrong":"")):""}" data-q="${i}" data-o="${j}" ${a!==undefined?"disabled":""} type="button">${esc(o)}</button>`).join("")}</div>
      ${a!==undefined?`<span class="why">${a===x[2]?"Correcto. ":"Era «"+esc(x[1][x[2]])+"». "}${esc(x[3])}</span>`:""}</div>`}).join("")}
    <div class="btnrow">${answered?'<button class="btn ghost" id="qreset" type="button">Repetir práctica</button>':""}<a class="link" href="${link}" target="_blank" rel="noopener" style="align-self:center">Más ejercicios en Test-English ↗</a></div>`}
  </section>`;
}
function bindQuiz(el,s){
  el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{quizSel[s]=quizSel[s]||{};quizSel[s][+b.dataset.q]=+b.dataset.o;
    const y=window.scrollY;renderHoy();window.scrollTo(0,y);
    const q=QUIZ[s];if(Object.keys(quizSel[s]).length===q.qs.length){const ok=q.qs.filter((x,i)=>quizSel[s][i]===x[2]).length;toast(`Resultado: ${ok} de ${q.qs.length}`)}});
  const r=el.querySelector("#qreset");if(r)r.onclick=()=>{delete quizSel[s];renderHoy();document.getElementById("quiz").scrollIntoView()};

let vocabWeek=null;
function vocabCard(s){
  const vw=vocabWeek||Math.min(s,22), list=VOCAB[vw]||[], sabidas=list.filter((x,i)=>state.vocab[vw+":"+i]).length;
  let tot=0,totOk=0;for(const k in VOCAB){VOCAB[k].forEach((x,i)=>{tot++;if(state.vocab[k+":"+i])totOk++})}
  return `<section class="card fold" id="vocab" data-state="${openV}" style="--fc:var(--c-vocab);--fc-soft:var(--c-vocab-soft)">
    ${foldHead("v",openV,"Vocabulario · semana "+vw,SEMANAS[vw-1][2],sabidas+"/"+list.length,"c-vocab")}
    ${!openV?"":`<div class="dayhead"><span class="note">Cambiar de semana</span>
      <div class="arrows"><button class="iconbtn" id="vprev" aria-label="Lista anterior" ${vw===1?"disabled":""}>‹</button><button class="iconbtn" id="vnext" aria-label="Lista siguiente" ${vw===22?"disabled":""}>›</button></div></div>
    ${s>22&&!vocabWeek?'<p class="note">Estas semanas son de repaso: recorre las listas anteriores y repasa las palabras que aún no marcas.</p>':""}
    <div class="vbar"><div class="dayhead"><span class="note">${sabidas} de ${list.length} palabras de esta lista</span><span class="note num">${totOk}/${tot} en total</span></div><div class="bar" style="margin-top:4px"><span style="width:${list.length?sabidas/list.length*100:0}%"></span></div></div>
    <ul class="vlist">${list.map((x,i)=>{const on=!!state.vocab[vw+":"+i];return `<li class="vitem${on?" known":""}">
      <span><span class="w">${esc(x[0])}</span><br><span class="es">${esc(x[1])}</span></span>
      <button class="know${on?" on":""}" data-v="${vw}:${i}" type="button" ${canWrite?"":"disabled"}>${on?"La sé ✓":"La sé"}</button>
      <span class="ex">${esc(x[2])}</span></li>`}).join("")}</ul>
    <div class="btnrow"><button class="btn ghost" id="vcopy" type="button">Copiar lista para Anki</button>${IN_VIEWER?"":'<button class="btn ghost" id="vdl" type="button">Descargar para Anki</button>'}</div>
    <p class="note">Meta diaria: aprende 2 o 3 palabras de esta lista y súmalas a Anki. Usa cada una en una frase sobre tu trabajo.</p>`}
  </section>`;
}
function bindVocab(el,s){
  const vw=vocabWeek||Math.min(s,22);
  el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const k=b.dataset.v;if(state.vocab[k])delete state.vocab[k];else state.vocab[k]=true;
    persist();const y=window.scrollY;renderHoy();window.scrollTo(0,y)});
  if(!el.querySelector("#vprev")) return;
  el.querySelector("#vprev").onclick=()=>{vocabWeek=Math.max(1,vw-1);renderHoy();document.getElementById("vocab").scrollIntoView()};
  el.querySelector("#vnext").onclick=()=>{vocabWeek=Math.min(22,vw+1);renderHoy();document.getElementById("vocab").scrollIntoView()};
  const txt=()=>(VOCAB[vw]||[]).map(x=>x[0]+"\t"+x[1]+"<br><i>"+x[2]+"</i>").join("\n");
  el.querySelector("#vcopy").onclick=()=>{try{navigator.clipboard.writeText(txt()).then(()=>toast("Lista copiada"),()=>toast("No se pudo copiar"))}catch(e){toast("No se pudo copiar")}};
  const dl=el.querySelector("#vdl");if(dl)dl.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt()],{type:"text/plain"}));a.download="vocabulario-semana-"+vw+".txt";document.body.appendChild(a);a.click();a.remove()};
}

function renderHoy(){

  const ts=tareas(viewIdx), p=prog(viewIdx), mins=ts.reduce((a,t)=>a+t.m,0), realIdx=dayIndex(today());

}

function renderAvance(){
  const el=document.getElementById("v-avance");
  const t=dayIndex(today()), hasta=Math.min(t,TOTAL_DAYS-1);
  let hechas=0,total=0,activos=0,hTot=0,hHechas=0;
  for(let i=0;i<TOTAL_DAYS;i++){const p=prog(i);hechas+=p.done;total+=p.total;if(p.done)activos++;if(i<=hasta){hTot+=p.total;hHechas+=p.done}}
  const pPlan=Math.round(hechas/total*100), pDia=hTot?Math.round(hHechas/hTot*100):0;
  const r=racha(), best=mejorRacha(), hitosOk=HITOS.filter(h=>state.hitos[h.id]).length;
  // mapa: 6 semanas hasta la actual
  const sw=Math.floor(Math.max(0,hasta)/7), desde=Math.max(0,(sw-5)*7);
  let cells="";
  for(let i=desde;i<desde+42&&i<TOTAL_DAYS;i++){const p=prog(i);let c="";if(i<=hasta&&p.done){const q=p.done/p.total;c=q>=1?"lv3":q>=.5?"lv2":"lv1"}
    cells+=`<span class="${c}" title="${fecha(addDays(START_D,i))}: ${p.done}/${p.total}"></span>`}

  <section class="card"><h2>Tu avance</h2>
    <div class="stats">
      <div class="stat"><div class="v num">${r.n}</div><div class="l">días de racha (mejor: ${best})</div></div>
      <div class="stat"><div class="v num">${pDia}%</div><div class="l">de lo planeado hasta hoy</div></div>
      <div class="stat"><div class="v num">${activos}</div><div class="l">días estudiando</div></div>
      <div class="stat"><div class="v num">${hitosOk}/${HITOS.length}</div><div class="l">hitos cumplidos</div></div>

  <section class="card"><h3>Calendario de constancia</h3>

    <div class="legend"><span>Menos</span><i></i><i style="background:color-mix(in srgb,var(--flame) 35%,var(--line))"></i><i style="background:color-mix(in srgb,var(--flame) 65%,var(--line))"></i><i style="background:var(--flame)"></i><span>Día completo</span></div>
  </section>
  <section class="card"><h3>Por fase</h3>
    ${FASES.map(f=>{let d=0,tt=0;for(let i=(f.desde-1)*7;i<f.hasta*7;i++){const p=prog(i);d+=p.done;tt+=p.total}
      return `<div class="phase" style="--pc:${["var(--accent)","var(--c-gram)","var(--c-speak)"][f.n-1]}"><div class="row"><b>Fase ${f.n}: ${esc(f.nombre)}</b><span class="muted num">${Math.round(d/tt*100)}%</span></div><div class="bar"><span style="width:${d/tt*100}%"></span></div><span class="note">Semanas ${f.desde}–${f.hasta}. ${esc(f.meta)}</span></div>`}).join("")}
    <div class="phase"><div class="row"><b>Plan completo</b><span class="muted num">${pPlan}% · ${hechas}/${total}</span></div><div class="bar"><span style="width:${pPlan}%"></span></div></div>
  </section>
  <section class="card"><h3>Puntajes EF SET</h3>
    ${scores.length?`<div class="scroll"><table><thead><tr><th>Fecha</th><th>Puntaje</th><th>Nivel</th><th></th></tr></thead><tbody>
      ${scores.map(x=>`<tr><td>${esc(x.f)}</td><td class="num">${x.p}</td><td><span class="chip">${nivel(x.p)}</span></td><td><button class="iconbtn" data-del="${esc(x.f)}|${x.p}" aria-label="Borrar puntaje">×</button></td></tr>`).join("")}
    </tbody></table></div>`:'<p class="note">Aún no hay puntajes. Haz el EF SET de 50 minutos en efset.org y anótalo aquí.</p>'}
    <form class="inline" id="scoreform">
      <label for="sf">Fecha<input type="date" id="sf" required value="${key(today())}"></label>
      <label for="sp">Puntaje<input type="number" id="sp" min="0" max="100" required style="width:96px"></label>
      <button class="btn" type="submit" ${canWrite?"":"disabled"}>Agregar</button>
    </form>
    <p class="note">41–50 es B1 (apunta a B2 First). 51–60 es B2 (apunta a C1 Advanced).</p>
  </section>
  <section class="card"><h3>Respaldo</h3>
    <p class="note">Copia tu avance para pasarlo a otro dispositivo, o pega aquí un respaldo para recuperarlo.</p>
    <div class="btnrow">
      <button class="btn ghost" id="copyb" type="button">Copiar respaldo</button>
      ${IN_VIEWER?"":'<button class="btn ghost" id="dlb" type="button">Descargar archivo</button>'}
    </div>

      <label class="btn ghost" for="impf" style="display:inline-flex;align-items:center">Abrir archivo<input type="file" id="impf" accept=".json,application/json,text/plain" hidden></label></div>

    const f=el.querySelector("#sf").value,p=+el.querySelector("#sp").value;

  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const [f,p]=b.dataset.del.split("|");
    const i=state.scores.findIndex(x=>x.f===f&&String(x.p)===p);if(i>=0){state.scores.splice(i,1);persist();renderAll()}});
  const json=()=>JSON.stringify({app:"ruta-ingles",v:1,...state});
  el.querySelector("#copyb").onclick=()=>{const txt=json();
    const fb=()=>{const ta=el.querySelector("#impt");ta.value=txt;ta.select();toast("Selecciona y copia el texto del recuadro")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Respaldo copiado"),fb)}catch(e){fb()}};
  const dl=el.querySelector("#dlb"); if(dl) dl.onclick=()=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json()],{type:"application/json"}));
    a.download="ruta-ingles-respaldo-"+key(today())+".json";document.body.appendChild(a);a.click();a.remove()};
  const importar=txt=>{try{const d=JSON.parse(txt);if(!d||typeof d!=="object"||!d.checks) throw 0;
      state={checks:Object.assign({},state.checks,d.checks),hitos:Object.assign({},state.hitos,d.hitos||{}),scores:[...state.scores],errores:mergeErr(state.errores,d.errores||[]),vocab:Object.assign({},state.vocab,d.vocab||{})};
      (d.scores||[]).forEach(s=>{if(!state.scores.some(x=>x.f===s.f&&x.p===s.p))state.scores.push(s)});
      persist();renderAll();toast("Respaldo importado")}catch(e){toast("Ese texto no es un respaldo válido de esta app")}};
  el.querySelector("#impb").onclick=()=>{const v=el.querySelector("#impt").value.trim();if(v) importar(v)};
  el.querySelector("#impf").onchange=e=>{const f=e.target.files[0];if(!f) return;const r=new FileReader();r.onload=()=>importar(r.result);r.readAsText(f)};
}


const CATS=["Tiempos verbales","Preposiciones","Vocabulario","Artículos","Concordancia","Orden de palabras","Pronunciación","Otro"];
const TIPICOS=[

 ["The people is waiting.","The people are waiting.","Concordancia","«People» es plural."],

 ["We need more informations.","We need more information.","Concordancia","«Information» no tiene plural."],
 ["The 5G will change the life.","5G will change people's lives.","Artículos","Sin «the» al hablar de algo en general."],
 ["I make a question.","I ask a question.","Vocabulario","«Ask a question», no «make»."],
 ["I didn't went to the site.","I didn't go to the site.","Tiempos verbales","Después de «didn't», verbo en base."],
 ["Is very important the throughput.","Throughput is very important.","Orden de palabras","En inglés el sujeto va siempre y va primero."],
 ["«e-speak», «e-site»","speak, site","Pronunciación","No agregues «e» antes de s + consonante."]];
let errFiltro="pend";
function mergeErr(a,b){const m=new Map();[...(a||[]),...(b||[])].forEach(e=>{const o=m.get(e.id);if(!o||(e.n||1)>(o.n||1)||e.ok!==o.ok&&(e.u||"")>(o.u||""))m.set(e.id,e)});return [...m.values()]}
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function renderErrores(){
  const el=document.getElementById("v-errores");
  const E=state.errores||[], pend=E.filter(e=>!e.ok), dom=E.filter(e=>e.ok);
  const porCat={}; E.forEach(e=>{if(!e.ok)porCat[e.cat]=(porCat[e.cat]||0)+(e.n||1)});
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]), maxC=cats.length?cats[0][1]:1;
  const top=[...pend].sort((a,b)=>(b.n||1)-(a.n||1)||(b.f>a.f?1:-1)).slice(0,5);
  const lista=(errFiltro==="pend"?pend:errFiltro==="dom"?dom:E).slice().sort((a,b)=>(b.n||1)-(a.n||1)||(b.f>a.f?1:-1));
  const ya=new Set(E.map(e=>e.mal.toLowerCase()));

      ${cats.length?`<div><span class="eyebrow">Dónde fallas más</span><div class="catbars" style="margin-top:8px">${cats.map(([c,n])=>`<div class="catbar"><span>${esc(c)}</span><div class="bar"><span style="width:${n/maxC*100}%"></span></div><span class="num muted">${n}</span></div>`).join("")}</div></div>`:""}
      ${cats.length?`<p class="note">Enfócate esta semana en <b>${esc(cats[0][0].toLowerCase())}</b>: repasa esos errores antes de tu speaking grabado.</p>`:""}`
    :'<p class="note">Aún no anotas errores. Cada vez que te grabes hablando o te corrijan, anota aquí lo que dijiste y la forma correcta. Abajo tienes errores típicos de hispanohablantes para empezar.</p>'}
  </section>
  <section class="card"><h3>Anotar un error</h3>

      <label class="note" for="e-bien">Forma correcta</label><input type="text" id="e-bien" required placeholder="It depends on the coverage">
      <label class="note" for="e-cat">Tipo</label><select id="e-cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
      <div><button class="btn" type="submit" ${canWrite?"":"disabled"}>Guardar error</button></div>
    </form></section>
  ${E.length?`<section class="card"><div class="dayhead"><h3>Mis errores</h3>
    <div class="filters">${[["pend","Por corregir"],["dom","Dominados"],["all","Todos"]].map(([k,t])=>`<button class="sbtn${errFiltro===k?" on":""}" data-f="${k}" type="button">${t}</button>`).join("")}</div></div>
    ${lista.length?lista.map(e=>`<div class="err${e.ok?" ok":""}">
      <div class="pair"><span class="mk" style="color:var(--flame)">✕</span><span class="bad">${esc(e.mal)}</span><span class="mk" style="color:var(--good)">✓</span><span class="good">${esc(e.bien)}</span></div>
      <div class="meta"><span>${esc(e.cat)} · repetido ${e.n||1} ${(e.n||1)===1?"vez":"veces"}</span>
        <span class="acts">${e.ok?"":`<button class="sbtn" data-mas="${e.id}" type="button">Lo repetí +1</button>`}
        <button class="sbtn${e.ok?" on":""}" data-ok="${e.id}" type="button">${e.ok?"Dominado":"Ya lo domino"}</button>
        <button class="sbtn" data-borrar="${e.id}" type="button" aria-label="Borrar error">Borrar</button></span></div>
    </div>`).join(""):'<p class="note">No hay errores en este filtro.</p>'}
  </section>`:""}
  <section class="card"><details${E.length?"":" open"}><summary>Errores típicos de hispanohablantes</summary>

  </details></section></div>`;

  el.querySelector("#errform").onsubmit=ev=>{ev.preventDefault();

  const find=id=>state.errores.find(e=>e.id===id);

  el.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const e=find(b.dataset.ok);e.ok=!e.ok;e.u=now();persist();renderErrores();if(e.ok)toast("Un error menos")});
  el.querySelectorAll("[data-borrar]").forEach(b=>b.onclick=()=>{state.errores=state.errores.filter(e=>e.id!==b.dataset.borrar);persist();renderErrores()});
  el.querySelectorAll("[data-tip]").forEach(b=>b.onclick=()=>{const t=TIPICOS[+b.dataset.tip];

}

function renderAll(){renderTop();renderHoy();renderSemana();renderAvance();renderErrores();renderPlan()}
function show(v){document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  ["hoy","semana","avance","errores","plan"].forEach(x=>document.getElementById("v-"+x).hidden=x!==v);
  window.scrollTo(0,0);try{localStorage.setItem(LS+"-tab",v)}catch(e){}}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>show(b.dataset.view));

loadLocal(); renderAll();
try{const t=localStorage.getItem(LS+"-tab");if(t)show(t)}catch(e){}
setStatus(IN_VIEWER?"Conectando…":"Guardado en este dispositivo. Funciona sin internet.");
// al volver a la app otro día, refresca la fecha
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const t=clampIdx(dayIndex(today()));if(renderAll._day!==t){renderAll._day=t;viewIdx=t;renderAll()}}});
renderAll._day=clampIdx(dayIndex(today()));

// ---------- sincronización (solo dentro de claude.ai) ----------
if(IN_VIEWER)(async()=>{
  const db=await window.claude.use("db");
  if(!db){setStatus("Guardado en este navegador.");return}
  ref=db.doc("progreso/kholler");
  const timer=setTimeout(()=>setStatus("Sin conexión por ahora. Guardado en este navegador.",true),10000);
  let primera=true;
  ref.onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(timer);
    mode="db";
    if(snap.exists){const d=snap.data(), remote={checks:d.checks||{},hitos:d.hitos||{},scores:d.scores||[],errores:d.errores||[],vocab:d.vocab||{}};
      // la copia en la nube manda; se ignoran copias viejas y lo que llega justo después de tocar algo
      if(snap.metadata.fromCache||snap.metadata.hasPendingWrites) return;
      if(pending>0||Date.now()-lastEdit<2500){if(primera){primera=false;if(pending===0)persist()}return;}
      primera=false;
      if(JSON.stringify(remote)===JSON.stringify(state)) return;
      state=remote; saveLocal();
    } else if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites&&primera){primera=false;
      if(Object.keys(state.checks).length||Object.keys(state.hitos).length||state.scores.length||state.errores.length||Object.keys(state.vocab).length) persist()}
    if(!snap.metadata.fromCache) setStatus("Sincronizado con tu cuenta.");
    const y=window.scrollY; renderAll(); window.scrollTo(0,y);
  },()=>{clearTimeout(timer);mode="local";setStatus("Sin sincronización. Guardado en este navegador.",true)});
})();

// ---------- modo app instalada (sin internet) ----------
if(!IN_VIEWER&&"serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
})();
</script>
