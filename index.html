<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DailyEnglish">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>DailyEnglish</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna; tarjeta de racha arriba, tareas debajo, barra de pestañas fija abajo */
:root{
  --bg:#e8eef8; --surface:#ffffff; --surface2:#f2f6fc; --ink:#141c2b; --muted:#56637a; --line:#d4ddea;
  --accent:#0a9584; --accent-ink:#ffffff; --accent-soft:#c6f1e8;
  --flame:#ef5a12; --flame-soft:#ffd9c2; --good:#22a04f; --good-soft:#cdf3da;
  --c-gram:#4b4fe6; --c-gram-soft:#d7d9ff; --c-speak:#e02d68; --c-speak-soft:#ffd3e1;
  --c-vocab:#c27a00; --c-vocab-soft:#ffe7a8; --c-listen:#1a72e8; --c-listen-soft:#cfe3ff;
  --c-shadow:#7d32ea; --c-shadow-soft:#e5d5ff; --hero:linear-gradient(135deg,#ffddc6 0%,#ffcfe0 50%,#ddd2ff 100%);
  --band:linear-gradient(135deg,#c4f0e7 0%,#d2e2ff 100%); --bad:var(--c-speak); --bad-soft:var(--c-speak-soft);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1320; --surface:#151f2e; --surface2:#1b2738; --ink:#eaf0f7; --muted:#9aa9bd; --line:#2b3b51;
  --accent:#2fd6c2; --accent-ink:#04211d; --accent-soft:#0f4440; --flame:#ff8a45; --flame-soft:#4a2410; --good:#4fd67f; --good-soft:#0f3d22;
  --c-gram:#8f93ff; --c-gram-soft:#2a2c66; --c-speak:#ff6f9c; --c-speak-soft:#521a30;
  --c-vocab:#ffc23d; --c-vocab-soft:#4a360a; --c-listen:#5aa9ff; --c-listen-soft:#143661;
  --c-shadow:#b98aff; --c-shadow-soft:#3a1f63; --hero:linear-gradient(135deg,#4a2410 0%,#4d1830 50%,#2e1f5c 100%);
  --band:linear-gradient(135deg,#0f4440 0%,#1a2f63 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1320; --surface:#151f2e; --surface2:#1b2738; --ink:#eaf0f7; --muted:#9aa9bd; --line:#2b3b51;
  --accent:#2fd6c2; --accent-ink:#04211d; --accent-soft:#0f4440; --flame:#ff8a45; --flame-soft:#4a2410; --good:#4fd67f; --good-soft:#0f3d22;
  --c-gram:#8f93ff; --c-gram-soft:#2a2c66; --c-speak:#ff6f9c; --c-speak-soft:#521a30;
  --c-vocab:#ffc23d; --c-vocab-soft:#4a360a; --c-listen:#5aa9ff; --c-listen-soft:#143661;
  --c-shadow:#b98aff; --c-shadow-soft:#3a1f63; --hero:linear-gradient(135deg,#4a2410 0%,#4d1830 50%,#2e1f5c 100%);
  --band:linear-gradient(135deg,#0f4440 0%,#1a2f63 100%); color-scheme:dark}
/* Paleta Enfoque: base azul fría y alto contraste para concentrarse; ámbar solo para lo que pide acción (racha, tarea principal) */
:root[data-palette="focus"]{
  --bg:#edf3fb; --surface:#ffffff; --surface2:#f2f7fd; --ink:#0b1a2e; --muted:#4a5b74; --line:#d0dcea;
  --accent:#1f6feb; --accent-ink:#ffffff; --accent-soft:#dbe8fd;
  --flame:#e98a00; --flame-soft:#ffefd2; --good:#178a47; --good-soft:#d4f1df; --bad:#d6336c; --bad-soft:#fde0ea;
  --c-gram:#1f6feb; --c-gram-soft:#dbe8fd; --c-speak:#0a8f9e; --c-speak-soft:#d2f1f4;
  --c-vocab:#bf7400; --c-vocab-soft:#ffeccb; --c-listen:#2f5bd3; --c-listen-soft:#dfe6fb;
  --c-shadow:#4b5fd6; --c-shadow-soft:#e2e6fb; --hero:linear-gradient(135deg,#d8e7ff 0%,#e3f3ff 60%,#fff1d6 100%);
  --band:linear-gradient(135deg,#dbe8fd 0%,#dcf2f5 100%)}
@media (prefers-color-scheme: dark){:root[data-palette="focus"]:not([data-theme="light"]){
  --bg:#0a1321; --surface:#111f32; --surface2:#16283e; --ink:#eaf2fb; --muted:#9cb0c9; --line:#253f5d;
  --accent:#5aa2ff; --accent-ink:#04182f; --accent-soft:#143156; --flame:#ffb020; --flame-soft:#3d2a08; --good:#4fd18a; --good-soft:#0f3a25; --bad:#ff6b8f; --bad-soft:#4a1626;
  --c-gram:#5aa2ff; --c-gram-soft:#143156; --c-speak:#38c7d3; --c-speak-soft:#0f3a40; --c-vocab:#ffc14d; --c-vocab-soft:#3d2e0c;
  --c-listen:#7aa8ff; --c-listen-soft:#1a2f5a; --c-shadow:#9aa8ff; --c-shadow-soft:#23285a;
  --hero:linear-gradient(135deg,#13294a 0%,#0f3340 60%,#3a2a0c 100%); --band:linear-gradient(135deg,#143156 0%,#0f3a40 100%)}}
:root[data-palette="focus"][data-theme="dark"]{
  --bg:#0a1321; --surface:#111f32; --surface2:#16283e; --ink:#eaf2fb; --muted:#9cb0c9; --line:#253f5d;
  --accent:#5aa2ff; --accent-ink:#04182f; --accent-soft:#143156; --flame:#ffb020; --flame-soft:#3d2a08; --good:#4fd18a; --good-soft:#0f3a25; --bad:#ff6b8f; --bad-soft:#4a1626;
  --c-gram:#5aa2ff; --c-gram-soft:#143156; --c-speak:#38c7d3; --c-speak-soft:#0f3a40; --c-vocab:#ffc14d; --c-vocab-soft:#3d2e0c;
  --c-listen:#7aa8ff; --c-listen-soft:#1a2f5a; --c-shadow:#9aa8ff; --c-shadow-soft:#23285a;
  --hero:linear-gradient(135deg,#13294a 0%,#0f3340 60%,#3a2a0c 100%); --band:linear-gradient(135deg,#143156 0%,#0f3a40 100%)}
.focustip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--flame-soft);color:var(--ink);font-size:14px}
.focustip b{color:var(--flame)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Evita el zoom por doble toque en iPhone y el zoom automático al escribir (iOS acerca si el texto del campo mide menos de 16px) */
html,body,*{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:24px;line-height:1.1;background:linear-gradient(90deg,var(--accent),var(--c-gram));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;line-height:1.2}
h3{font-size:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);margin:0}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,.task:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabecera */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .sub{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;background:var(--flame-soft);color:var(--flame);font:700 15px var(--display);white-space:nowrap}
.topr{display:flex;align-items:center;gap:8px}
.themebtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.themebtn svg{width:20px;height:20px}
.themeopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themeopt{font:600 14px var(--body);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;touch-action:manipulation}
.themeopt svg{width:24px;height:24px}
.themeopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--surface2);color:var(--muted)}
.pill svg{width:18px;height:18px}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}

/* racha */
.card.hero{background:var(--hero);border-color:transparent}
.card.dayc{position:relative;overflow:hidden}
.dayband{margin:-16px -16px 0;padding:14px 16px;background:var(--band)}
.streak{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.flame{width:84px;height:84px;border-radius:22px;background:var(--surface);box-shadow:0 6px 18px -8px var(--flame);display:grid;place-items:center;position:relative}
.flame svg{width:46px;height:46px;color:var(--flame)}
.flame.off{background:var(--surface);box-shadow:none}
.flame.off svg{color:var(--muted);opacity:.6}
.streak .big{font:800 44px/1 var(--display);letter-spacing:-.03em}
.streak .lbl{font-weight:600}
.streak .msg{font-size:13.5px;margin-top:4px}
.msg.warn{color:var(--flame)}
.msg.ok{color:var(--good)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.days .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.days .c{width:30px;height:30px;border-radius:50%;border:2px solid color-mix(in srgb,var(--flame) 30%,var(--line));background:var(--surface);display:grid;place-items:center}
.days .c.on{background:var(--flame);border-color:var(--flame)}
.days .c.on svg{width:15px;height:15px;color:var(--surface)}
.days .c.today{border-color:var(--flame);border-style:dashed}
.days .c.future{opacity:.45}
.best{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.best b{color:var(--ink);font-variant-numeric:tabular-nums}

/* día */
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.arrows{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;cursor:pointer;display:grid;place-items:center;font-size:16px}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.txt{width:auto;padding:0 12px;font-weight:600;font-size:14px}
.ringrow{display:flex;align-items:center;gap:14px}
.ring{width:58px;height:58px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font:700 14px var(--display);fill:var(--ink)}
.topics{display:grid;gap:8px}
.topic{border-radius:12px;padding:8px 10px;background:var(--tc-soft)}
.topic .eyebrow{color:var(--tc);font-weight:700}
.topic{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:baseline;font-size:14px}
.topic b{font-weight:600}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
button.task{width:100%;text-align:left;font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface)}
.task:disabled{cursor:default}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--c,var(--accent));background:var(--c-soft,transparent);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;color:var(--surface);opacity:0}
.task.done{background:var(--c-soft,var(--accent-soft));border-color:transparent}
.task.done .box{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.task.done .box svg{opacity:1}
.task.done .t{text-decoration:line-through;text-decoration-color:var(--c,var(--accent))}
.task .t .lbl{color:var(--c,var(--ink))}
.task.main:not(.done){border-color:color-mix(in srgb,var(--flame) 55%,var(--line))}
.task .t{font-weight:600}
.task .dd{font-size:13.5px;color:var(--muted);display:block}
.task .m{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--flame-soft);color:var(--flame);margin-left:6px;vertical-align:1px}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.wd.today{border:2px solid var(--accent)}
.wd .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.wd .p{font:700 14px var(--display)}
.dot{width:80%;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.dot i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--c-listen))}
.rows{display:flex;flex-direction:column}
.rowi{display:grid;grid-template-columns:86px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rowi:last-child{border-bottom:0}
.rowi.cur{color:var(--accent);font-weight:600}

/* avance */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:12px}
.stat:nth-child(1){background:var(--flame-soft)}.stat:nth-child(1) .v{color:var(--flame)}
.stat:nth-child(2){background:var(--c-listen-soft)}.stat:nth-child(2) .v{color:var(--c-listen)}
.stat:nth-child(3){background:var(--c-gram-soft)}.stat:nth-child(3) .v{color:var(--c-gram)}
.stat:nth-child(4){background:var(--good-soft)}.stat:nth-child(4) .v{color:var(--good)}
.stat .v{font:800 28px/1.1 var(--display)}
.stat .l{font-size:12.5px;color:var(--muted)}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.phase{display:flex;flex-direction:column;gap:5px}
.phase .bar span{background:var(--pc,var(--accent))}
.phase .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat span{aspect-ratio:1;border-radius:6px;background:var(--line);max-width:100%}
.heat span.lv1{background:color-mix(in srgb,var(--flame) 35%,var(--line))}
.heat span.lv2{background:color-mix(in srgb,var(--flame) 65%,var(--line))}
.heat span.lv3{background:var(--flame)}
.heat-head{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font:500 11px var(--mono);color:var(--muted);text-align:center}
.legend{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr.cur td{background:var(--accent-soft)}
.scroll{overflow-x:auto}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--c-gram-soft);color:var(--c-gram)}
form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
form.inline label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input[type=number],input[type=date],textarea{font:500 15px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:80px;font:500 12.5px var(--mono)}
.btn{font:600 14px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.sync{font-size:12.5px;color:var(--muted);text-align:center}
.sync.warn{color:var(--flame)}

/* errores */
.catbars{display:flex;flex-direction:column;gap:8px}
.catbar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:13.5px}
.catbar .bar span{background:linear-gradient(90deg,var(--c-speak),var(--flame))}
.err{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.err.ok{opacity:.6}
.err .pair{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;align-items:baseline}
.err .bad{color:var(--flame);text-decoration:line-through;text-decoration-thickness:1.5px}
.err .good{font-weight:600}
.err .mk{font:700 13px var(--mono)}
.err .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.err .acts{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{font:600 12.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.sbtn.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.count{font:800 18px var(--display);color:var(--c-speak);min-width:28px}
.top5{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.top5 li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline;font-size:14px}
.form-err{display:grid;gap:8px}
.form-err input[type=text],.form-err select{font:500 15px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);width:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:600}
/* tarjetas plegables */
.foldhead{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.foldhead:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.foldhead .badge{font:700 13px var(--mono);padding:3px 10px;border-radius:999px;background:var(--fc-soft);color:var(--fc)}
.chev{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fc-soft);color:var(--fc);transition:transform .2s}
.chev svg{width:16px;height:16px}
.fold[data-state="true"] .chev{transform:rotate(180deg)}
.fold .hint{font-size:13px;color:var(--muted)}
/* enlaces de tareas */
.tlinks{display:flex;flex-wrap:wrap;gap:6px;padding:8px 2px 2px 44px}
a.rlink,button.rlink{font:600 12.5px var(--body);padding:5px 11px;border-radius:999px;background:var(--c-soft);color:var(--c);text-decoration:none;border:0;cursor:pointer;touch-action:manipulation}
a.rlink.wk{background:var(--c);color:var(--surface)}
/* grabadora */
.recbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border-radius:16px;background:var(--c-speak-soft)}
.recbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--c-speak);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px -8px var(--c-speak);touch-action:manipulation}
.recbtn svg{width:34px;height:34px}
.recbtn.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c-speak) 55%,transparent)}50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--c-speak) 0%,transparent)}}
.rectime{font:800 26px var(--display);color:var(--c-speak)}
.guide{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
audio{width:100%}
.fb{display:flex;flex-direction:column;gap:8px}
.fbi{border-radius:14px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:4px}
.fbi .bad{color:var(--bad);text-decoration:line-through}
.fbi .good{font-weight:700;color:var(--good)}
.fbi .why{font-size:13.5px;color:var(--muted)}
.lvl{display:inline-block;font:800 15px var(--display);padding:3px 12px;border-radius:999px;background:var(--c-gram-soft);color:var(--c-gram)}
.recs{display:flex;flex-direction:column;gap:8px}
.reci{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface2);font-size:13.5px}
/* pronunciación */
.target{font:700 19px/1.45 var(--display);padding:14px;border-radius:14px;background:var(--c-shadow-soft)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.wd2{font:600 15px var(--body);padding:4px 10px;border-radius:10px;border:0;cursor:pointer;touch-action:manipulation}
.wd2.ok{background:var(--good-soft);color:var(--good)}
.wd2.bad{background:var(--bad-soft);color:var(--bad);text-decoration:underline;text-decoration-style:wavy}
.pscore{font:800 30px var(--display)}
.tip{border-radius:12px;padding:10px 12px;background:var(--surface2);font-size:14px;display:flex;flex-direction:column;gap:4px}
.micbig{width:64px;height:64px;border-radius:50%;border:0;background:var(--c-shadow);color:#fff;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.micbig svg{width:28px;height:28px}.micbig.on{animation:pulse 1.2s ease-in-out infinite}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* estructura */
.esec{display:flex;flex-direction:column;gap:8px}
.esec h4{margin:4px 0 0;font:700 15px var(--display);color:var(--c-gram)}
.er{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 12px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--ec)}
.er .lb{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ec)}
.er .fx{grid-column:1/-1;font-weight:700;font-size:14.5px}
.er .ex{font-size:14px;color:var(--muted);font-style:italic}
.er .say{border:0;background:transparent;color:var(--ec);font-size:16px;cursor:pointer;padding:0 4px;align-self:end}
select.topicsel{font:600 14px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);width:100%}
/* perfil */
.toph{display:flex;align-items:center;gap:10px;min-width:0}
.avbtn{border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%;flex:none;touch-action:manipulation}
.av{border-radius:50%;display:grid;place-items:center;overflow:hidden;color:#fff;font:800 var(--avf,16px) var(--display);background:var(--avc,var(--accent));flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:58%;height:58%}
.avbig{display:flex;flex-direction:column;align-items:center;gap:10px}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emo{font-size:24px;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.emo[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.col{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.col[aria-pressed="true"]{border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input[type=text],.field select{font:600 16px var(--body);padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink)}
.count{font:800 34px var(--display);color:var(--accent)}
/* diccionario */
.dform{display:flex;gap:8px}
.dform input{flex:1;min-width:0;font:600 16px var(--body);padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink)}
.dword{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dword h2{font-size:26px}
.ipa{font:500 15px var(--mono);color:var(--muted)}
.tr{font:700 18px var(--display);color:var(--accent)}
.pos{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--c-vocab)}
.defs{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.defs .eg{color:var(--muted);font-style:italic;display:block}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chip2{text-decoration:none;font:600 13px var(--body);padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.saved{display:flex;flex-direction:column;gap:6px}
.savedi{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.savedi b{font-size:15px}.savedi span{font-size:13.5px;color:var(--muted)}
/* práctica */
.q{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface2)}
.q .s{font-weight:600}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:600 14px var(--body);padding:8px 14px;border-radius:999px;border:2px solid var(--c-gram);background:var(--surface);color:var(--c-gram);cursor:pointer}
.opt.right{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.why{font-size:13.5px;color:var(--muted)}
.score{font:800 22px var(--display);color:var(--c-gram)}
a.link{color:var(--c-gram);font-weight:600}
/* vocabulario */
.vlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.vitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--c-vocab-soft)}
.vitem .w{font:700 16px var(--display);color:var(--ink)}
.vitem .es{font-size:13.5px;color:var(--c-vocab);font-weight:600}
.vitem .ex{grid-column:1/-1;font-size:13.5px;color:var(--muted);font-style:italic}
.vpr{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.vbtn{font:600 12.5px var(--body);padding:5px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c-vocab) 45%,transparent);background:var(--surface);color:var(--c-vocab);text-decoration:none;cursor:pointer;touch-action:manipulation}
.exsay{border:0;background:transparent;padding:0;font-size:14px;cursor:pointer;font-style:normal}
.vitem.known{background:var(--surface2)}
.vitem.known .w{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--c-vocab)}
.know{font:600 12.5px var(--body);border:2px solid var(--c-vocab);background:var(--surface);color:var(--c-vocab);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.know.on{background:var(--c-vocab);color:var(--surface)}
.vbar .bar span{background:var(--c-vocab)}
/* barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabbar button{min-width:0;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;cursor:pointer;font:600 11.5px var(--body)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--tb,var(--accent));background:var(--tb-soft,var(--accent-soft))}

/* aviso */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;transition:.25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const DIARIAS=[
 ["listening","Listening","Podcast o charla técnica: 6 Minute English, All Ears English o YouTube de 5G.",15],
 ["anki","Anki","2 o 3 palabras de la lista de vocabulario de abajo y el repaso del día.",10],

// ---------- fechas ----------
const mk=(y,m,d)=>new Date(y,m,d,12);
const START_D=mk(...START);
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayIndex=d=>Math.round((mk(d.getFullYear(),d.getMonth(),d.getDate())-START_D)/864e5);
const fecha=d=>d.getDate()+" "+MESES[d.getMonth()];
const TOTAL_DAYS=TOTAL_WEEKS*7;
const clampIdx=i=>Math.max(0,Math.min(TOTAL_DAYS-1,i));
const faseDe=s=>FASES.find(f=>s>=f.desde&&s<=f.hasta);
function today(){const n=new Date();return mk(n.getFullYear(),n.getMonth(),n.getDate())}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function tareas(idx){
  const s=Math.floor(idx/7)+1, wd=idx%7, f=faseDe(s), list=[];
  const COL={listening:"listen",anki:"vocab",shadowing:"shadow",hablar:"speak"};
  if(wd<5) DIARIAS.forEach(t=>list.push({id:t[0],t:t[1],d:t[2],m:t[3],col:COL[t[0]]}));
  else list.push({id:"anki",t:"Anki",d:"Repaso corto del día.",m:10,col:"vocab"});
  const p=PRINCIPAL[f.n][wd];
  list.push({id:"main",t:p[0],d:p[1],m:p[2],main:true,col:"flame"});
  return list;
}

let state={checks:{},hitos:{},scores:[],errores:[],vocab:{},pron:{},gram:{},vq:{},perfil:{},dicc:[]};
let ref=null, mode="local", writing=Promise.resolve(), canWrite=true;
const LS="ruta-ingles-v1";
const IN_VIEWER=!!(window.claude&&window.claude.use);
function loadLocal(){try{const s=localStorage.getItem(LS);if(s){const d=JSON.parse(s);state={checks:d.checks||{},hitos:d.hitos||{},scores:d.scores||[],errores:d.errores||[],vocab:d.vocab||{},pron:d.pron||{},gram:d.gram||{},vq:d.vq||{},perfil:d.perfil||{},dicc:d.dicc||[]}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function setStatus(t,warn){const el=document.getElementById("status");el.textContent=t;el.classList.toggle("warn",!!warn)}
let pending=0, lastEdit=0;
function persist(){
  lastEdit=Date.now();
  saveLocal();
  if(mode!=="db"||!ref) return;
  const body=JSON.parse(JSON.stringify(state));
  pending++;
  writing=writing.then(()=>ref.set(body)).finally(()=>{pending--;lastEdit=Date.now()}).then(()=>setStatus("Sincronizado con tu cuenta.")).catch(e=>{
    if(e&&e.code==="invalid_argument"){canWrite=false;setStatus("Solo lectura en esta página.",true);renderAll()}
    else setStatus("No se pudo sincronizar. Quedó guardado en este dispositivo.",true)});
}

// ---------- cálculos ----------
function prog(idx){
  if(idx<0||idx>=TOTAL_DAYS) return {done:0,total:0};
  const k=key(addDays(START_D,idx)), ts=tareas(idx);
  return {done:ts.filter(t=>state.checks[k+":"+t.id]).length,total:ts.length};
}
const activo=i=>prog(i).done>0;
function racha(){
  const t=dayIndex(today()); if(t<0) return {n:0,hoy:false};
  let i=Math.min(t,TOTAL_DAYS-1); const hoy=t<TOTAL_DAYS&&activo(t);
  if(!hoy) i--;
  let n=0; while(i>=0&&activo(i)){n++;i--}
  return {n,hoy};
}
function mejorRacha(){let b=0,c=0;for(let i=0;i<TOTAL_DAYS;i++){if(activo(i)){c++;b=Math.max(b,c)}else c=0}return b}
const nivel=p=>p<=30?"A1":p<=40?"A2":p<=50?"B1":p<=60?"B2":p<=70?"C1":"C2";

const APPNAME=document.getElementById("hello").textContent;
const AVCOL=["#1f6feb","#0a8f9e","#e98a00","#d6336c","#7a4fd6","#178a47"];
const EMOJIS=["🧑‍💻","📡","🎧","🚀","🦉","🐯","🎓","🔥","⚡","🌎","🦅","🏔️"];
function iniciales(n){const p=(n||"").trim().split(/\s+/).filter(Boolean);return p.length?(p[0][0]+(p[1]?p[1][0]:"")).toUpperCase():""}
function avatarHTML(px){const pf=state.perfil||{},c=pf.color||AVCOL[0],st=`width:${px}px;height:${px}px;--avc:${c};--avf:${Math.round(px*.42)}px`;
  if(pf.tipo==="foto"&&pf.foto) return `<span class="av" style="${st}"><img src="${pf.foto}" alt=""></span>`;
  if(pf.tipo==="emoji"&&pf.emoji) return `<span class="av" style="${st};font-size:${Math.round(px*.55)}px">${pf.emoji}</span>`;
  const ini=iniciales(pf.nombre); return `<span class="av" style="${st}">${ini?esc(ini):'<svg><use href="#i-user"/></svg>'}</span>`}
function diasExamen(){const f=(state.perfil||{}).fecha;if(!f)return null;const [y,m,d]=f.split("-").map(Number);return Math.round((mk(y,m-1,d)-today())/864e5)}

function streakCard(){
  const r=racha(), best=mejorRacha(), t=dayIndex(today());
  let msg, cls;
  if(r.hoy){msg="Hoy ya sumaste a tu racha.";cls="ok"}
  else if(r.n>0){msg=`Marca una tarea hoy para no perder tus ${r.n} día${r.n===1?"":"s"}.`;cls="warn"}
  else {msg="Marca tu primera tarea de hoy para empezar la racha.";cls="warn"}
  // últimos 7 días terminando hoy
  let cells="";
  for(let i=6;i>=0;i--){const idx=t-i, d=addDays(today(),-i), on=activo(idx), wd=(d.getDay()+6)%7;
    cells+=`<div class="d"><span class="c${on?" on":""}${i===0&&!on?" today":""}">${on?'<svg><use href="#i-check"/></svg>':""}</span>${DC[wd]}</div>`}
  return `<section class="card hero" aria-label="Racha">
    <div class="streak">
      <div class="flame${r.hoy?"":" off"}" id="flame"><svg><use href="#i-flame"/></svg></div>
      <div><div class="big num">${r.n}</div><div class="lbl">día${r.n===1?"":"s"} de racha</div><div class="msg ${cls}">${msg}</div></div>
    </div>
    <div class="days">${cells}</div>
    <div class="best"><span>Mejor racha: <b>${best}</b></span><span>La racha cuenta si marcas al menos una tarea en el día.</span></div>
  </section>`;
}

let pronSR=null;
function bindPron(el,s){

    pron.res=comparar(target,pron.heard);pron.sel=null;const k=sw+":"+i;
    if(pron.res.score>(state.pron[k]||0)){state.pron[k]=pron.res.score;persist()}

      pronSR.onend=()=>{pron.listening=false;if(pron.heard.trim()){const x=document.getElementById("pheard");if(x)x.value=pron.heard;check()}else rerenderRec()};

      pron.heard="";pron.res=null;pron.listening=true;pronSR.start();rerenderRec()}
    catch(e){pron.listening=false;toast("Usa el micrófono del teclado");rerenderRec()}};
}

  if(!sampleFn||!dicQ)return; dicBusy=true;renderDic();

Busca: "${dicQ}". Si está en español, da la palabra o frase en inglés y explícala igual.
Responde SOLO con JSON: {"palabra":"en inglés","traduccion":"1 a 3 traducciones al español","ipa":"/IPA americana/","significados":[{"tipo":"sustantivo|verbo|adjetivo|adverbio|expresión","def":"significado en español, corto","ejemplo":"oración en inglés, de preferencia de trabajo o telecom"}],"nota":"consejo breve de uso o pronunciación para hispanohablantes"}`,{modelTier:"quick"});
    dicRes=Object.assign(dicRes||{w:d.palabra||dicQ,dir:"en",senses:[],enW:d.palabra||dicQ,es:d.traduccion||"",fuente:"Claude"},{claude:d});if(!dicRes.ipa)dicRes.ipa=d.ipa||"";dicMsg=""}
  catch(e){toast(e&&e.code==="not_granted"?"Necesito tu permiso para usar Claude":"No se pudo consultar ahora")}
  dicBusy=false;renderDic();
}
function sonarPalabra(){if(!dicRes)return;const w=dicRes.enW||dicRes.w;if(dicRes.audio){try{const a=new Audio(dicRes.audio);a.play().catch(()=>hablar(w,.85));return}catch(e){}}hablar(w,.85)}
function renderDic(){
  const el=document.getElementById("v-dic"); if(!el) return; const r=dicRes, enc=encodeURIComponent(r?r.w:dicQ);
  const guardada=r&&(state.dicc||[]).some(x=>x.w.toLowerCase()===(r.enW||r.w).toLowerCase());
  el.innerHTML=`<div class="wrap" style="gap:14px">
  <div><button class="iconbtn txt" id="dicback" type="button">‹ Volver</button></div>
  <section class="card"><h2>Diccionario</h2>
    <form class="dform" id="dicform"><input type="search" id="dicq" value="${esc(dicQ)}" placeholder="Palabra en inglés o español (funciona sin internet)" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search"><button class="btn" type="submit">Buscar</button></form>
    ${dicBusy?'<p class="note">Buscando…</p>':""}${dicMsg?`<p class="note">${esc(dicMsg)}</p>`:""}
  </section>
  ${r?`<section class="card">
    <div class="dword"><h2>${esc(r.w)}</h2>${r.ipa?`<span class="ipa">${esc(r.ipa)}</span>`:""}</div>
    ${r.base?`<p class="note">Forma de «${esc(r.base)}»</p>`:""}
    <div class="btnrow"><button class="btn ghost" id="dsay" type="button">🔊 Escuchar${r.dir==="es"?" en inglés":""}</button><button class="btn ghost" id="dslow" type="button">🐢 Lento</button><button class="btn${guardada?" ghost":""}" id="dsave" type="button" ${guardada||!canWrite?"disabled":""}>${guardada?"Guardada ✓":"Guardar en mis palabras"}</button></div>
    ${r.senses.length?`<ol class="defs">${r.senses.slice(0,8).map(x=>`<li>${x.pos?`<span class="pos">${esc(x.pos)}</span> `:""}<b class="tr" style="font-size:16px">${esc(x.tr)}</b>${x.gl?`<span class="eg">${esc(x.gl)}</span>`:""}</li>`).join("")}</ol>`:""}
    ${r.vocab&&r.vocab.length?`<div class="fbi" style="background:var(--c-vocab-soft)"><span class="pos">En tus listas${r.vocab[0].sem?" · semana "+r.vocab[0].sem:""}</span><b>${esc(r.vocab[0].w)} = ${esc(r.vocab[0].es)}</b>${r.vocab[0].ej?`<span class="eg" style="font-style:italic;color:var(--muted)">${esc(r.vocab[0].ej)} <button class="exsay" type="button" data-say="${esc(r.vocab[0].ej)}" aria-label="Escuchar ejemplo">🔊</button></span>`:""}</div>`:""}
    ${r.online&&r.online.means.length?`<details><summary>Definiciones en inglés</summary>${r.online.means.map(m=>`<div style="margin-top:8px"><span class="pos">${esc(m.pos)}</span><ol class="defs">${m.defs.map(x=>`<li>${esc(x.d)}${x.e?`<span class="eg">${esc(x.e)} <button class="exsay" type="button" data-say="${esc(x.e)}" aria-label="Escuchar ejemplo">🔊</button></span>`:""}</li>`).join("")}</ol>${m.syn&&m.syn.length?`<div class="chips2" style="margin-top:6px">${m.syn.map(y=>`<button class="chip2" type="button" data-buscar="${esc(y)}">${esc(y)}</button>`).join("")}</div>`:""}</div>`).join("")}</details>`:""}
    ${r.claude?`<div class="fbi"><span class="pos">Explicación de Claude</span>${r.claude.traduccion?`<b>${esc(r.claude.traduccion)}</b>`:""}${(r.claude.significados||[]).map(m=>`<span>${m.tipo?`<span class="pos">${esc(m.tipo)}</span> `:""}${esc(m.def||"")}${m.ejemplo?`<span class="eg" style="display:block;font-style:italic;color:var(--muted)">${esc(m.ejemplo)}</span>`:""}</span>`).join("")}${r.claude.nota?`<span class="note">${esc(r.claude.nota)}</span>`:""}</div>`:""}
    ${sampleFn&&!r.claude?`<button class="btn ghost" id="dclaude" type="button" ${dicBusy?"disabled":""}>Explicación con ejemplos de Claude</button>`:""}
    <p class="note">Fuente: ${esc(r.fuente||"")}${r.online?" + definiciones en línea":""}.</p>
  </section>`:""}
  ${dicQ?`<section class="card"><span class="eyebrow">Ver también</span><div class="chips2">
    <a class="chip2" href="https://www.wordreference.com/es/translation.asp?tranword=${enc}" target="_blank" rel="noopener">WordReference ↗</a>
    <a class="chip2" href="https://dictionary.cambridge.org/search/direct/?datasetsearch=english-spanish&q=${enc}" target="_blank" rel="noopener">Cambridge inglés-español ↗</a>
    <a class="chip2" href="https://youglish.com/pronounce/${enc}/english" target="_blank" rel="noopener">Escucharla en videos ↗</a></div></section>`:""}
  <section class="card"><h3>Mis palabras${(state.dicc||[]).length?" ("+state.dicc.length+")":""}</h3>
    ${(state.dicc||[]).length?`<div class="saved">${[...state.dicc].reverse().map(x=>`<div class="savedi"><div><b>${esc(x.w)}</b> ${x.ipa?`<span>${esc(x.ipa)}</span>`:""}<br><span>${esc(x.es||"")}</span></div><span class="acts"><button class="sbtn" type="button" data-buscar="${esc(x.w)}">Ver</button> <button class="sbtn" type="button" data-dsay="${esc(x.w)}">🔊</button> <button class="sbtn" type="button" data-ddel="${esc(x.w)}">Borrar</button></span></div>`).join("")}</div>
      <button class="btn ghost" id="dcopy" type="button">Copiar para Anki</button>`:'<p class="note">Las palabras que guardes aparecen aquí, para repasarlas y pasarlas a Anki.</p>'}
  </section></div>`;
  el.querySelector("#dicback").onclick=()=>show(prevView);
  el.querySelector("#dicform").onsubmit=e=>{e.preventDefault();const i=el.querySelector("#dicq");i.blur();buscarPalabra(i.value)};
  el.querySelectorAll("[data-buscar]").forEach(b=>b.onclick=()=>{buscarPalabra(b.dataset.buscar);scrollTo(0,0)});
  el.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>hablar(b.dataset.say,.85));
  el.querySelectorAll("[data-dsay]").forEach(b=>b.onclick=()=>hablar(b.dataset.dsay,.8));
  el.querySelectorAll("[data-ddel]").forEach(b=>b.onclick=()=>{state.dicc=(state.dicc||[]).filter(x=>x.w!==b.dataset.ddel);persist();renderDic()});
  const sy=el.querySelector("#dsay");if(sy)sy.onclick=sonarPalabra;
  const sl=el.querySelector("#dslow");if(sl)sl.onclick=()=>hablar(r.enW||r.w,.55);
  const dc=el.querySelector("#dclaude");if(dc)dc.onclick=explicarClaude;
  const sv=el.querySelector("#dsave");if(sv)sv.onclick=()=>{state.dicc=unirDicc(state.dicc,[{w:r.enW||r.w,es:r.dir==="es"?r.w:r.es,ipa:r.ipa,f:key(today())}]);persist();renderDic();toast("Guardada en tus palabras")};
  const cp=el.querySelector("#dcopy");if(cp)cp.onclick=()=>{const t=state.dicc.map(x=>x.w+"\t"+(x.es||"")+(x.ipa?" "+x.ipa:"")).join("\n");try{navigator.clipboard.writeText(t).then(()=>toast("Lista copiada"),()=>toast("No se pudo copiar"))}catch(e){toast("No se pudo copiar")}};
}
function renderPerfil(){
  const el=document.getElementById("v-perfil"), pf=state.perfil||{}, dx=diasExamen();
  el.innerHTML=`<div class="wrap" style="gap:14px">
  <div><button class="iconbtn txt" id="pfback" type="button">‹ Volver</button></div>
  <section class="card"><h2>Mi perfil</h2>
    <div class="avbig">${avatarHTML(104)}
      <div class="btnrow" style="justify-content:center"><label class="btn" for="pffoto" style="display:inline-flex;align-items:center;cursor:pointer">Subir foto</label>${pf.tipo==="foto"?'<button class="btn ghost" id="pfquitar" type="button">Quitar foto</button>':""}</div>
      <input type="file" id="pffoto" accept="image/*" hidden>
    </div>
    <label class="field" for="pfnombre">Tu nombre<input type="text" id="pfnombre" maxlength="40" value="${esc(pf.nombre||"")}" placeholder="Escribe tu nombre" autocomplete="name"></label>
  </section>
  <section class="card"><h3>O elige un avatar</h3>
    <div class="emojis">${EMOJIS.map(e=>`<button class="emo" type="button" data-emo="${e}" aria-pressed="${pf.tipo==="emoji"&&pf.emoji===e}">${e}</button>`).join("")}</div>
    <button class="btn ghost" id="pfini" type="button" aria-pressed="${!pf.tipo||pf.tipo==="inicial"}">Usar mis iniciales${iniciales(pf.nombre)?" ("+esc(iniciales(pf.nombre))+")":""}</button>
    <div><span class="note">Color de fondo</span><div class="colors" style="margin-top:6px">${AVCOL.map(c=>`<button class="col" type="button" data-col="${c}" style="background:${c}" aria-label="Color ${c}" aria-pressed="${(pf.color||AVCOL[0])===c}"></button>`).join("")}</div></div>
  </section>
  <section class="card"><h3>Mi meta</h3>
    <label class="field" for="pfexam">Examen<select id="pfexam">${["","Cambridge B2 First","Cambridge C1 Advanced","IELTS","TOEFL iBT","Otro"].map(o=>`<option value="${o}" ${(pf.examen||"")===o?"selected":""}>${o||"Aún no decido"}</option>`).join("")}</select></label>
    <label class="field" for="pffecha">Fecha del examen<input type="date" id="pffecha" value="${esc(pf.fecha||"")}"></label>
    ${dx!=null?`<div class="fbi" style="align-items:center;text-align:center"><span class="count num">${dx<0?"✓":dx}</span><span class="note">${dx<0?"La fecha ya pasó":dx===0?"¡Tu examen es hoy!":"días para tu "+esc(pf.examen||"examen")}</span></div>`:'<p class="note">Pon la fecha y verás la cuenta regresiva arriba, junto a la semana.</p>'}
  </section>
  <p class="note" style="text-align:center">Tu perfil se guarda en este dispositivo${IN_VIEWER?" y en tu cuenta":""} y va incluido en el respaldo.</p></div>`;
  const set=(o)=>{state.perfil=Object.assign({},state.perfil,o);persist();renderTop();renderPerfil()};
  el.querySelector("#pfback").onclick=()=>show(prevView);
  const nm=el.querySelector("#pfnombre"); nm.onchange=()=>set({nombre:nm.value.trim()}); nm.oninput=()=>{state.perfil=Object.assign({},state.perfil,{nombre:nm.value});renderTop()};
  el.querySelectorAll("[data-emo]").forEach(b=>b.onclick=()=>set({tipo:"emoji",emoji:b.dataset.emo}));
  el.querySelector("#pfini").onclick=()=>set({tipo:"inicial"});
  el.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>set({color:b.dataset.col}));
  el.querySelector("#pfexam").onchange=e=>set({examen:e.target.value});
  el.querySelector("#pffecha").onchange=e=>set({fecha:e.target.value});
  const q=el.querySelector("#pfquitar"); if(q) q.onclick=()=>set({tipo:"inicial",foto:""});
  el.querySelector("#pffoto").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const S=180,c=document.createElement("canvas");c.width=c.height=S;const k=Math.min(img.width,img.height);
      c.getContext("2d").drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,S,S);set({tipo:"foto",foto:c.toDataURL("image/jpeg",.82)});toast("Foto actualizada")};
      img.onerror=()=>toast("No pude abrir esa imagen");img.src=rd.result};rd.readAsDataURL(f)};
}
function renderAll(){renderTop();renderPerfil();renderDic();renderHoy();renderSemana();renderAvance();renderErrores();renderPlan()}
function show(v){document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  ["hoy","semana","avance","errores","plan","perfil","dic"].forEach(x=>document.getElementById("v-"+x).hidden=x!==v);
  window.scrollTo(0,0);try{localStorage.setItem(LS+"-tab",v)}catch(e){}}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>show(b.dataset.view));
document.getElementById("dicbtn").onclick=()=>{const cur=["hoy","semana","avance","errores","plan"].find(x=>!document.getElementById("v-"+x).hidden);if(cur)prevView=cur;show("dic");cargarDic("en").catch(()=>{});cargarDic("es").catch(()=>{});setTimeout(()=>{const i=document.getElementById("dicq");if(i)i.focus()},50)};
document.getElementById("avbtn").onclick=()=>{const cur=["hoy","semana","avance","errores","plan"].find(x=>!document.getElementById("v-"+x).hidden);if(cur)prevView=cur;show("perfil")};

loadLocal(); renderAll();
try{const t=localStorage.getItem(LS+"-tab");if(t)show(t)}catch(e){}
setStatus(IN_VIEWER?"Conectando…":"Guardado en este dispositivo. Funciona sin internet.");
// al volver a la app otro día, refresca la fecha
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const t=clampIdx(dayIndex(today()));if(renderAll._day!==t){renderAll._day=t;viewIdx=t;renderAll()}}});
renderAll._day=clampIdx(dayIndex(today()));

// ---------- sincronización (solo dentro de claude.ai) ----------
if(IN_VIEWER)(async()=>{
  const db=await window.claude.use("db");
  if(!db){setStatus("Guardado en este navegador.");return}
  ref=db.doc("progreso/kholler");
  const timer=setTimeout(()=>setStatus("Sin conexión por ahora. Guardado en este navegador.",true),10000);
  let primera=true;
  ref.onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(timer);
    mode="db";
    if(snap.exists){const d=snap.data(), remote={checks:d.checks||{},hitos:d.hitos||{},scores:d.scores||[],errores:d.errores||[],vocab:d.vocab||{},pron:d.pron||{},gram:d.gram||{},vq:d.vq||{},perfil:d.perfil||{},dicc:d.dicc||[]};
      // la copia en la nube manda; se ignoran copias viejas y lo que llega justo después de tocar algo
      if(snap.metadata.fromCache||snap.metadata.hasPendingWrites) return;
      if(pending>0||Date.now()-lastEdit<2500){if(primera){primera=false;if(pending===0)persist()}return;}
      primera=false;
      if(JSON.stringify(remote)===JSON.stringify(state)) return;
      state=remote; saveLocal();
    } else if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites&&primera){primera=false;
      if(Object.keys(state.checks).length||Object.keys(state.hitos).length||state.scores.length||state.errores.length||Object.keys(state.vocab).length) persist()}
    if(!snap.metadata.fromCache) setStatus("Sincronizado con tu cuenta.");
    const y=window.scrollY; renderAll(); window.scrollTo(0,y);
  },()=>{clearTimeout(timer);mode="local";setStatus("Sin sincronización. Guardado en este navegador.",true)});
})();

// ---------- modo app instalada (sin internet) ----------
if(!IN_VIEWER&&"serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
})();
</script>
